apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-3-llm-d-utilization-admin
spec:
  config:
    display:
      name: LLM Utilization
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        display:
          name: Project
          description: Filter by project
        allowMultiple: true
        allowAllValue: true
        customAllValue: .*
        defaultValue: $__all
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: exported_namespace
            matchers:
            - kserve_vllm:num_requests_running
    - kind: ListVariable
      spec:
        name: model_name
        display:
          name: Model
          description: Filter by model
        allowMultiple: true
        allowAllValue: true
        customAllValue: .*
        defaultValue: $__all
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model_name
            matchers:
            - kserve_vllm:num_requests_running{exported_namespace=~"$namespace"}
    panels:
      gpuUtilization:
        kind: Panel
        spec:
          display:
            name: GPU utilization
            description: GPU compute utilization per pod. Low utilization with high
              queue depth may indicate a CPU or memory bottleneck.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: avg by (k8s_pod_name) (accelerator_gpu_utilization{exported_namespace=~"$namespace",model_name=~"$model_name"})
                  seriesNameFormat: '{{k8s_pod_name}}'
      queueDepthRunning:
        kind: Panel
        spec:
          display:
            name: Requests running
            description: Number of requests actively being processed per pod. Sustained
              high values indicate saturation.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (k8s_pod_name) (kserve_vllm:num_requests_running{exported_namespace=~"$namespace",model_name=~"$model_name"})
                  seriesNameFormat: '{{k8s_pod_name}}'
      queueDepthWaiting:
        kind: Panel
        spec:
          display:
            name: Requests waiting
            description: Number of requests queued and waiting per pod. Growth here
              signals the system is falling behind.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (k8s_pod_name) (kserve_vllm:num_requests_waiting{exported_namespace=~"$namespace",model_name=~"$model_name"})
                  seriesNameFormat: '{{k8s_pod_name}}'
      eppPerPodQueueSize:
        kind: Panel
        spec:
          display:
            name: Per-pod queue size (scheduler view)
            description: Queue depth per pod as observed by the EPP scheduler. Compare
              with vLLM-reported queue depth above to detect scraping lag or routing
              asymmetry. This metric is pool-wide and is not filtered by the model
              selector.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: inference_pool_per_pod_queue_size{exported_namespace=~"$namespace"}
                  seriesNameFormat: '{{model_server_pod}}'
      preemptionRate:
        kind: Panel
        spec:
          display:
            name: Preemption rate
            description: Rate of request preemptions per pod. Preemptions occur when
              KV cache pressure forces running requests to be evicted.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (k8s_pod_name) (rate(kserve_vllm:num_preemptions_total{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval]))
                  seriesNameFormat: '{{k8s_pod_name}}'
      eppReadyPods:
        kind: Panel
        spec:
          display:
            name: EPP ready endpoints
            description: Number of healthy model server endpoints visible to the EPP
              scheduler. A drop indicates pods failing health checks.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: inference_pool_ready_pods{exported_namespace=~"$namespace"}
                  seriesNameFormat: '{{name}}'
      eppAvgQueueSize:
        kind: Panel
        spec:
          display:
            name: EPP average queue size
            description: Average queue depth across all endpoints in the InferencePool
              as seen by the EPP scheduler.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: inference_pool_average_queue_size{exported_namespace=~"$namespace"}
                  seriesNameFormat: '{{name}}'
    layouts:
    - kind: Grid
      spec:
        display:
          title: GPU utilization
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/gpuUtilization'
    - kind: Grid
      spec:
        display:
          title: Queue depth
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/queueDepthRunning'
        - x: 12
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/queueDepthWaiting'
    - kind: Grid
      spec:
        display:
          title: Pod & pool detail
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/eppPerPodQueueSize'
        - x: 0
          y: 8
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/preemptionRate'
        - x: 8
          y: 8
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/eppReadyPods'
        - x: 16
          y: 8
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/eppAvgQueueSize'
