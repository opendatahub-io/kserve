apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-4-llm-d-performance-admin
spec:
  config:
    display:
      name: LLM Performance
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        display:
          name: Project
          description: Filter by project
        allowMultiple: true
        allowAllValue: true
        customAllValue: .*
        defaultValue: $__all
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: exported_namespace
            matchers:
            - kserve_vllm:num_requests_running
    - kind: ListVariable
      spec:
        name: model_name
        display:
          name: Model
          description: Filter by model
        allowMultiple: true
        allowAllValue: true
        customAllValue: .*
        defaultValue: $__all
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model_name
            matchers:
            - kserve_vllm:num_requests_running{exported_namespace=~"$namespace"}
    panels:
      ttft:
        kind: Panel
        spec:
          display:
            name: Time to first token (TTFT)
            description: Time from request arrival to first generated token. Sensitive
              to prompt length, cache hits, and queue depth.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P95
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P99
      e2eLatency:
        kind: Panel
        spec:
          display:
            name: E2E request latency
            description: Total request duration from submission to final token. Combines
              queuing, prefill, and generation time.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le) (rate(kserve_vllm:e2e_request_latency_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le) (rate(kserve_vllm:e2e_request_latency_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P95
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le) (rate(kserve_vllm:e2e_request_latency_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P99
      interTokenLatency:
        kind: Panel
        spec:
          display:
            name: Inter-token latency
            description: Time between consecutive output tokens during generation.
              Affects streaming responsiveness.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le) (rate(kserve_vllm:time_per_output_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le) (rate(kserve_vllm:time_per_output_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P95
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le) (rate(kserve_vllm:time_per_output_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P99
      kvCacheHitRate:
        kind: Panel
        spec:
          display:
            name: KV cache hit rate
            description: Fraction of prompt prefill served from cache. Higher rates
              reduce TTFT for repeated or similar prompts.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(rate(kserve_vllm:prefix_cache_hits_total{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval]))
                    / (sum(rate(kserve_vllm:prefix_cache_queries_total{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval]))
                    > 0)
                  seriesNameFormat: Hit rate
      kvCacheUsage:
        kind: Panel
        spec:
          display:
            name: KV cache usage
            description: Percentage of GPU memory allocated to KV cache that is currently
              in use. Near 100% triggers evictions.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
                max: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: avg(kserve_vllm:kv_cache_usage_perc{exported_namespace=~"$namespace",model_name=~"$model_name"})
                  seriesNameFormat: Usage
      perPodCacheHitRate:
        kind: Panel
        spec:
          display:
            name: Per-pod cache hit rate
            description: Prefix cache hit rate per pod. Uneven rates across pods may
              indicate routing is not preserving prompt locality.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (k8s_pod_name) (rate(kserve_vllm:prefix_cache_hits_total{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval]))
                    / (sum by (k8s_pod_name) (rate(kserve_vllm:prefix_cache_queries_total{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval]))
                    > 0)
                  seriesNameFormat: '{{k8s_pod_name}}'
      perPodCacheUsage:
        kind: Panel
        spec:
          display:
            name: Per-pod KV cache usage
            description: KV cache utilization per pod. Pods near 100% are at risk of
              preemptions and increased TTFT.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
                max: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: avg by (k8s_pod_name) (kserve_vllm:kv_cache_usage_perc{exported_namespace=~"$namespace",model_name=~"$model_name"})
                  seriesNameFormat: '{{k8s_pod_name}}'
      phaseLatency:
        kind: Panel
        spec:
          display:
            name: Prefill / decode latency
            description: Execution time for prefill and decode phases. Prefill measures
              scheduled-to-first-token; decode measures first-to-last token. Compare
              with TTFT/ITL above, which include queueing overhead.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le, model_name) (rate(kserve_vllm:request_prefill_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Prefill P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le, model_name) (rate(kserve_vllm:request_prefill_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Prefill P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le, model_name) (rate(kserve_vllm:request_prefill_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Prefill P99'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le, model_name) (rate(kserve_vllm:request_decode_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Decode P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le, model_name) (rate(kserve_vllm:request_decode_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Decode P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le, model_name) (rate(kserve_vllm:request_decode_time_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} Decode P99'
      eppSchedulerLatency:
        kind: Panel
        spec:
          display:
            name: EPP scheduling latency
            description: Time spent in the EPP scheduler (filter/score/pick plugins)
              per request. Isolates scheduling overhead from model execution time.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{exported_namespace=~"$namespace"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{exported_namespace=~"$namespace"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P95
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{exported_namespace=~"$namespace"}[$__rate_interval])))
                    > -Inf) or vector(0)
                  seriesNameFormat: P99
      perModelTTFT:
        kind: Panel
        spec:
          display:
            name: Per-model TTFT
            description: Time to first token per model at P50/P95/P99. Compare across
              models to identify SLA compliance issues in multi-model deployments.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: seconds
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.50, sum by (le, model_name) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} P50'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.95, sum by (le, model_name) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} P95'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (histogram_quantile(0.99, sum by (le, model_name) (rate(kserve_vllm:time_to_first_token_seconds_bucket{exported_namespace=~"$namespace",model_name=~"$model_name"}[$__rate_interval])))
                    > -Inf)
                  seriesNameFormat: '{{model_name}} P99'
    layouts:
    - kind: Grid
      spec:
        display:
          title: Latency
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/ttft'
        - x: 8
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/e2eLatency'
        - x: 16
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/interTokenLatency'
    - kind: Grid
      spec:
        display:
          title: KV cache
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/kvCacheHitRate'
        - x: 12
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/kvCacheUsage'
    - kind: Grid
      spec:
        display:
          title: Per-pod detail
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/perPodCacheHitRate'
        - x: 12
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/perPodCacheUsage'
    - kind: Grid
      spec:
        display:
          title: Phase latency
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/phaseLatency'
    - kind: Grid
      spec:
        display:
          title: EPP scheduling
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/eppSchedulerLatency'
    - kind: Grid
      spec:
        display:
          title: Per-model detail
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/perModelTTFT'
