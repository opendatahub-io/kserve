apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: opendatahub
data:
  # Keep the generic Kubernetes fallback FIPS-compatible; CHACHA20 is not FIPS-approved.
  ingress: |-
    {
        "enableGatewayApi": true,
        "kserveIngressGateway": "$(NAMESPACE)/inference-gateway",
        "enableLLMInferenceServiceTLS": true,
        "llmInferenceServiceTLSMinVersion": "VersionTLS12",
        "llmInferenceServiceTLSCipherSuites": "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
        "loraModelRoutingStrategy": "regex",
        "ingressGateway" : "knative-serving/knative-ingress-gateway",
        "knativeLocalGatewayService" : "knative-local-gateway.istio-system.svc.cluster.local",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "localGateway" : "istio-system/kserve-local-gateway",
        "localGatewayService" : "kserve-local-gateway.istio-system.svc.cluster.local",
        "ingressDomain"  : "example.com",
        "ingressClassName" : "istio",
        "domainTemplate": "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "https",
        "disableIstioVirtualHost": false,
        "disableIngressCreation": false
    }
  storageInitializer: |-
    {
        "image" : "REPLACE_IMAGE",
        "memoryRequest": "100Mi",
        "memoryLimit": "24Gi",
        "cpuRequest": "100m",
        "cpuLimit": "1",
        "cpuModelcar": "10m",
        "memoryModelcar": "15Mi",
        "enableModelcar": true,
        "uidModelcar": 1000
    }
  inferenceService: |-
    {
      "serviceAnnotationDisallowedList": [
        "autoscaling.knative.dev/min-scale",
        "autoscaling.knative.dev/max-scale",
        "internal.serving.kserve.io/storage-initializer-sourceuri",
        "kubectl.kubernetes.io/last-applied-configuration",
        "security.opendatahub.io/enable-auth",
        "networking.knative.dev/visibility",
        "opendatahub.io/hardware-profile-name",
        "opendatahub.io/hardware-profile-namespace"
      ]
    }
