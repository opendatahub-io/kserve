---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kserve-controller-manager
spec:
  podSelector:
    matchLabels:
      control-plane: kserve-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow API-server webhooks and kubelet probes from host-network sources.
    # Omit the peer podSelector: OVN needs the special namespace address set,
    # not an empty pod address set for the synthetic host-network namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
      ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
    # Admit metrics scrapers from OpenShift's monitoring namespace group.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
  # Explicit allow-all egress keeps Kubernetes API and DNS access working and
  # remains compatible with deployment-specific controller endpoints.
  egress:
    - {}
