apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-controller-manager
  namespace: kserve
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--metrics-addr=:8443"
        - "--metrics-secure"
        - "--leader-elect"
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
