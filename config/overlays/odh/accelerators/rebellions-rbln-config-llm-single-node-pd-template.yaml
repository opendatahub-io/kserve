apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-single-node-pd-template-rebellions-rbln
  annotations:
    openshift.io/display-name: vLLM Rebellions RBLN NPU LLMInferenceServiceConfig Single Node P/D (Prefill/Decode)
    openshift.io/description: vLLM Rebellions RBLN NPU LLMInferenceServiceConfig Single Node P/D (Prefill/Decode) for LLMInferenceService.
    opendatahub.io/recommended-accelerators: '["rebellions.ai/npu"]'
    opendatahub.io/recommended-dra-drivers: '["npu.rebellions.ai"]'
    opendatahub.io/runtime-version: ""
    # supported-topologies values must be consistent with the samples API and Dashboard usage.
    # See https://github.com/opendatahub-io/odh-model-controller/blob/incubating/server/docs/features/samples/llm-d/llm-d-ui-flow-mechanics.md
    # and https://github.com/opendatahub-io/odh-model-controller/blob/incubating/server/docs/features/llm-d/samples/samples-api.md
    opendatahub.io/supported-topologies: '["workload-single-node-pd"]'
spec:
  template:
    containers:
      - name: main
        image: placeholder
        env:
          # vllm-rbln compiles the model for the NPU on first start; the engine waits for it.
          # The compile takes 30 to 160 minutes depending on the model.
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "9600"
          # vllm-rbln rejects a disabled chunked prefill. The RBLN connector must be named here:
          # without a --kv-transfer-config the base adds the stock NixlConnector.
          - name: VLLM_ADDITIONAL_ARGS
            value: "--enable-chunked-prefill --model-impl=vllm --kv-transfer-config '{\"kv_connector\":\"RblnNixlConnector\",\"kv_role\":\"kv_both\",\"kv_buffer_device\":\"rbln\",\"kv_connector_extra_config\":{\"name\":\"nixl\"}}'"
        # The base startupProbe allows 10 minutes; a cold NPU compile takes longer.
        # 500 x 30 s = 250 minutes, which covers the longest compile with headroom. Decode's vLLM is on
        # 8001; 8000 is the routing sidecar, which answers at once and would let liveness kill the compile.
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 30
          failureThreshold: 500
  prefill:
    template:
      containers:
        - name: main
          image: placeholder
          env:
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "9600"
            - name: VLLM_ADDITIONAL_ARGS
              value: "--enable-chunked-prefill --model-impl=vllm --kv-transfer-config '{\"kv_connector\":\"RblnNixlConnector\",\"kv_role\":\"kv_both\",\"kv_buffer_device\":\"rbln\",\"kv_connector_extra_config\":{\"name\":\"nixl\"}}'"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 500
