apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kserve-modelcache-tls-distro-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # The main ODH overlay owns the shared TLS profile reader role. Keep this
  # binding with ModelCache so namespace transforms target its service accounts.
  name: kserve-tls-distro-role
subjects:
  - kind: ServiceAccount
    name: kserve-localmodel-controller-manager
    namespace: model-serving-cache
  - kind: ServiceAccount
    name: kserve-localmodelnode-agent
    namespace: model-serving-cache
