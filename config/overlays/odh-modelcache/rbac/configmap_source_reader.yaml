apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kserve-modelcache-configmap-source-reader
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kserve-modelcache-configmap-source-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kserve-modelcache-configmap-source-reader
subjects:
- kind: ServiceAccount
  name: kserve-localmodel-controller-manager
  namespace: model-serving-cache
- kind: ServiceAccount
  name: kserve-localmodelnode-agent
  namespace: model-serving-cache
