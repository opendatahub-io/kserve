apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kserve-localmodel-ca-bundle
  namespace: model-serving-cache
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["odh-kserve-custom-ca-bundle"]
  verbs: ["get", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["kserve-localmodel-controller-manager"]
  verbs: ["get"]
