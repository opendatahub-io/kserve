---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kserve-localmodel-controller-manager
spec:
  podSelector:
    matchLabels:
      control-plane: kserve-localmodel-controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OpenShift's host-network group is the intended source for API-server
    # webhook calls and kubelet probes; confirm the source on target clusters.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
          podSelector: {}
      ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
    # Admit metrics scrapers from OpenShift's monitoring namespace group.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
  # Explicit allow-all egress keeps Kubernetes API and DNS access working and
  # remains compatible with configured registry endpoints used by ModelCache.
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kserve-localmodelnode-agent
spec:
  podSelector:
    matchLabels:
      control-plane: kserve-localmodelnode-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Admit metrics scrapers from OpenShift's monitoring group. The ODH
    # DaemonSet does not configure a health probe, so only metrics is exposed.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
  # Explicit allow-all egress keeps Kubernetes API and DNS access working with
  # deployment-specific cluster endpoints. Download Jobs need separate policy.
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kserve-localmodel-download
spec:
  # Selects per-node model download Jobs: the localmodelnode agent stamps
  # serving.kserve.io/localmodel-download: node onto the Job pod template
  # (enhanceDownloadJob). No other workload in the namespace carries the label,
  # so agent, permission-fix, import and serving pods are not selected.
  podSelector:
    matchLabels:
      serving.kserve.io/localmodel-download: node
  policyTypes:
    - Egress
  # Download destinations (model storage, registries, identity providers, DNS)
  # are deployment-specific, so egress is allow-all. Egress-only by design: no
  # ingress rules are added and the pods keep the namespace's default ingress
  # isolation.
  egress:
    - {}
