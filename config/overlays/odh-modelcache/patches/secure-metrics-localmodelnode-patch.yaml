apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kserve-localmodelnode-agent
  namespace: kserve
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--metrics-addr=:8443"
        - "--metrics-secure"
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
