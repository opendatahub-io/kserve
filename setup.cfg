[codespell]
# Generated/vendored files and binary data
skip = *.json,*.yaml,*.yml,*.svg,go.sum,go.mod,*.pb.go,*.pb,swagger.json,openapi_generated.go,.git,vendor,node_modules,
# Skip generated install manifests in directory scans and explicit file lists
    ./install,./hack/setup/quick-install,install/*,hack/setup/quick-install/*,
# Tokenizer vocabulary – subword tokens trigger false positives
    ./python/custom_tokenizer/vocab.txt,
# Sample training data
    ./docs/samples/v1beta1/sklearn,
# Embedded base64 image data is not prose
    ./docs/odh/fvt-tests.md
# Go CamelCase identifiers: WithT (gomega helper), UpToDate/NotIn (constants), allReady, caNew, VAs, optIn
# Auto-generated Python: querys (OpenAPI Generator api_client.py), maxium (datamodel-codegen openapi.py)
# Valid terms: re-use, keep-alives (HTTP idle timeout), ist/Worte (German in test assertions)
# Log output abbreviation: ERRO (vllm log level)
# Device names: renderD (DRM render nodes, /dev/dri/renderD128)
# Go test symbol: AfterAll; product acronyms: COO, AKS
ignore-words-list = witht,uptodate,notin,querys,maxium,re-use,keep-alives,ist,worte,vas,allready,canew,erro,unparseable,optin,renderd,afterall,coo,aks
count =
