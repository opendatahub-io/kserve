# Certificate for the model-serving-api Service on xKS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: model-serving-api
spec:
  commonName: model-serving-api.$(NAMESPACE).svc
  dnsNames:
    - model-serving-api.$(NAMESPACE).svc
    - model-serving-api.$(NAMESPACE).svc.cluster.local
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  issuerRef:
    name: $(ISSUER_REF_NAME)
    kind: $(ISSUER_REF_KIND)
    group: $(ISSUER_REF_GROUP)
  # Must match the secret mounted by the model-serving-api Deployment.
  secretName: model-serving-api-tls
