apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: csr-kserve-vllm-omni-cuda
  labels:
    opendatahub.io/managed: "true"
    opendatahub.io/dashboard: "true"
    opendatahub.io/ootb: "true"
  annotations:
    opendatahub.io/version: "1.0.0"
    opendatahub.io/template-display-name: "vLLM-Omni"
    opendatahub.io/runtime-version: "v0.26.0"
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vLLM-Omni NVIDIA GPU ServingRuntime for KServe - Tech Preview
spec:
  annotations:
    opendatahub.io/kserve-runtime: "vllm-omni"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    monitoring.opendatahub.io/scrape: "true"
  multiModel: false
  supportedModelFormats:
    - autoSelect: false
      name: vLLM
  containers:
    - name: kserve-container
      image: $(vllm-omni-cuda-image)
      command:
        - vllm
        - serve
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--omni"
        - "--log-stats"
        - "--served-model-name={{.Name}}"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 40
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 15
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
