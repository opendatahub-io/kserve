apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: csr-kserve-vllm-spyre-ppc64le
  labels:
    opendatahub.io/managed: "true"
    opendatahub.io/dashboard: "true"
    opendatahub.io/ootb: "true"
  annotations:
    opendatahub.io/version: "1.0.0"
    opendatahub.io/template-display-name: "vLLM"
    opendatahub.io/runtime-version: "v0.21.0"
    opendatahub.io/recommended-accelerators: '["ibm.com/spyre_pf"]'
    openshift.io/display-name: vLLM Spyre ppc64le ServingRuntime for KServe
spec:
  annotations:
    opendatahub.io/kserve-runtime: "vllm"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
  multiModel: false
  schedulerName: spyre-scheduler
  supportedModelFormats:
    - autoSelect: false
      name: vLLM
  containers:
    - name: kserve-container
      image: $(vllm-spyre-image)
      args:
        - "--model=/mnt/models"
        - "--port=8000"
        - "--served-model-name={{.Name}}"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8000
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
