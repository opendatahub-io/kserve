name: Post-Release E2E Validation

# Validates an ODH release install path via kserve-module operator:
# KserveReady, release image tags, operand stability, and ISVC/LLMISVC smoke.
#
# Trigger manually after ODH release workflows complete, or automatically on
# odh-v* tag push (uses the published Quay operator image for that tag).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "ODH release tag (e.g. odh-v3.5)"
        required: true
        type: string
      platform:
        description: "Target platform (xks for Minikube CI, ocp for OpenShift)"
        required: false
        default: xks
        type: choice
        options:
          - xks
          - ocp
      operator_image:
        description: "Optional override for kserve-module operator image"
        required: false
        type: string
  push:
    tags:
      - "odh-v*"

permissions: {}

env:
  QUAY_OPERATOR_IMAGE: quay.io/opendatahub/odh-kserve-module-operator

jobs:
  post-release-e2e:
    name: Post-release kserve-module E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Resolve release tag
        id: vars
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_OPERATOR_IMAGE: ${{ github.event.inputs.operator_image }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PLATFORM="xks"
            IMAGE="${QUAY_OPERATOR_IMAGE}:${TAG}"
          else
            TAG="${INPUT_RELEASE_TAG}"
            PLATFORM="${INPUT_PLATFORM:-xks}"
            if [[ -n "${INPUT_OPERATOR_IMAGE}" ]]; then
              IMAGE="${INPUT_OPERATOR_IMAGE}"
            else
              IMAGE="${QUAY_OPERATOR_IMAGE}:${TAG}"
            fi
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "operator_image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "Using operator image: ${IMAGE} (platform=${PLATFORM})"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.vars.outputs.release_tag }}
          persist-credentials: false

      - name: Setup Minikube
        if: steps.vars.outputs.platform == 'xks'
        uses: ./.github/actions/minikube-setup

      - name: Pull published operator image
        run: |
          docker pull "${{ steps.vars.outputs.operator_image }}"

      - name: Load operator image into Minikube
        if: steps.vars.outputs.platform == 'xks'
        run: |
          minikube image load "${{ steps.vars.outputs.operator_image }}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Setup cluster and deploy controller
        run: |
          make e2e-setup-kserve-module \
            PLATFORM=${{ steps.vars.outputs.platform }} \
            E2E_IMG=${{ steps.vars.outputs.operator_image }}

      - name: Run post-release validation
        env:
          KSERVE_RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: make e2e-kserve-module-post-release

      - name: Collect debug logs
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs deployment/kserve-module-controller-manager -n opendatahub --tail=200 || true
          echo "=== odh-model-controller logs ==="
          kubectl logs deployment/odh-model-controller -n opendatahub --tail=100 || true
          echo "=== Kserve CR ==="
          kubectl get kserve -A -o yaml || true
          echo "=== Deployments ==="
          kubectl get deploy -n opendatahub -o wide || true
          echo "=== Pods ==="
          kubectl get pods -n opendatahub -o wide || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-release-e2e-results
          path: kserve-module/tests/e2e/.pytest_cache/
          retention-days: 14
