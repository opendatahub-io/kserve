name: Post-Release E2E Validation

# ODH post-release smoke (OpenShift):
#   fresh install → odh-model-controller Running + KServeReady=True
#   → create one LLMInferenceService and confirm Ready=True
#
# GitHub-hosted runners cannot provision OpenShift. Same convention as Prow
# e2e-kserve-module and Konflux group testing: run against an existing cluster:
#   make e2e-setup-kserve-module PLATFORM=ocp E2E_IMG=...
#   make e2e-kserve-module-post-release
#
# workflow_dispatch expects an OpenShift kubeconfig on the runner.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "ODH release tag (e.g. odh-v3.5)"
        required: true
        type: string
      operator_image:
        description: "Optional override for kserve-module operator image"
        required: false
        type: string

permissions: {}

env:
  QUAY_OPERATOR_IMAGE: quay.io/opendatahub/odh-kserve-module-operator

jobs:
  post-release-e2e:
    name: Post-release kserve-module E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Resolve release tag
        id: vars
        env:
          INPUT_OPERATOR_IMAGE: ${{ github.event.inputs.operator_image }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_RELEASE_TAG}"
          if [[ -n "${INPUT_OPERATOR_IMAGE}" ]]; then
            IMAGE="${INPUT_OPERATOR_IMAGE}"
          else
            IMAGE="${QUAY_OPERATOR_IMAGE}:${TAG}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "operator_image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Using operator image: ${IMAGE}"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.vars.outputs.release_tag }}
          persist-credentials: false

      - name: Verify OpenShift cluster
        run: |
          if ! kubectl api-resources --api-group=config.openshift.io 2>/dev/null | grep -qi clusterversions; then
            echo "Post-release smoke requires OpenShift."
            echo "GitHub-hosted runners cannot provision OpenShift."
            echo "Run against an OpenShift cluster:"
            echo "  make e2e-setup-kserve-module PLATFORM=ocp E2E_IMG=${{ steps.vars.outputs.operator_image }}"
            echo "  make e2e-kserve-module-post-release"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Setup cluster and deploy controller
        env:
          OPERATOR_IMAGE: ${{ steps.vars.outputs.operator_image }}
        run: |
          make e2e-setup-kserve-module \
            PLATFORM=ocp \
            E2E_IMG="$OPERATOR_IMAGE"

      - name: Run post-release validation
        run: make e2e-kserve-module-post-release

      - name: Collect debug logs
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs deployment/kserve-module-controller-manager -n opendatahub --tail=200 || true
          echo "=== odh-model-controller logs ==="
          kubectl logs deployment/odh-model-controller -n opendatahub --tail=100 || true
          echo "=== Kserve CR ==="
          kubectl get kserve -A -o yaml || true
          echo "=== Deployments ==="
          kubectl get deploy -n opendatahub -o wide || true
          echo "=== Pods ==="
          kubectl get pods -n opendatahub -o wide || true
          echo "=== LLMInferenceService ==="
          kubectl get llminferenceservice -A -o yaml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-release-e2e-results
          path: kserve-module/tests/e2e/.pytest_cache/
          retention-days: 14
