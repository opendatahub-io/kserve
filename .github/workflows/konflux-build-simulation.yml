name: Konflux build simulation

# Konflux builds ten images from every pull request through the PipelineRuns in
# .tekton/. Nothing else does: the *-docker-publish workflows are path-filtered
# and build for linux/arm64 without GOTAGS=distro, and distro-build-check only
# compiles Go. So a broken image stage, a dropped build-arg or a Python package
# that cannot install first shows up in Konflux after merge.
#
# This simulates what Konflux does with the PR: the matrix is generated from
# .tekton/ at run time, each image is built with its exact dockerfile, context
# and build args, and then started. A target that cannot be mapped fails the
# gate instead of disappearing.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Every job grants its own scope; keep the workflow default empty.
permissions: {}

concurrency:
  # A new commit supersedes the previous run. Edits and label changes must not
  # cancel, or the required summary flips to cancelled mid-review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  targets:
    name: Resolve Konflux targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should-skip: ${{ steps.decide.outputs.should-skip }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The changed-file list is a diff against the pull request base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install yq
        run: make yq

      - name: Generate the build matrix
        id: decide
        env:
          # Pull request text is attacker-controlled. It reaches the script
          # through env, never through ${{ }} inside run:.
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          # A change that can alter an image Konflux builds. Everything else
          # (docs, unrelated tests) skips, but the skip is reported, never
          # silent.
          relevant='^(\.tekton/)|(^\.github/workflows/konflux-build-simulation\.ya?ml$)|(^\.github/actions/)|(^hack/konflux-sim/)|(Dockerfile)|(^\.dockerignore$)|(^go\.(mod|sum)$)|(^cmd/)|(^pkg/)|(^python/)|(^kserve-module/)'

          skip=false
          skip_title=false
          skip_label=false
          case "${PR_TITLE}" in
            *"[skip konflux-sim]"*) skip_title=true ;;
          esac
          case ",${PR_LABELS}," in
            *",skip-konflux-sim,"*) skip_label=true ;;
          esac

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            # workflow_dispatch and merge_group have no pull_request payload.
            :
          elif [ "${skip_title}" = "true" ] || [ "${skip_label}" = "true" ]; then
            skip=true
          else
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "${BASE_SHA}" --depth=1
            fi
            changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
            if ! grep -Eq "${relevant}" <<< "${changed}"; then
              skip=true
            fi
          fi

          echo "should-skip=${skip}" >> "${GITHUB_OUTPUT}"

          matrix="$(./hack/konflux-sim/generate-build-matrix.sh)"
          # A gate that resolves nothing guards nothing.
          jq -e '.include | length > 0' <<< "${matrix}" >/dev/null

          {
            echo "matrix<<MATRIX_EOF"
            echo "${matrix}"
            echo "MATRIX_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarise the resolved targets
        env:
          MATRIX: ${{ steps.decide.outputs.matrix }}
        run: |
          set -euo pipefail
          {
            echo "### Konflux targets"
            echo
            echo "| Image | Dockerfile | Simulated | Platforms |"
            echo "| --- | --- | --- | --- |"
            jq -r '.include[] | "| `\(.name)` | `\(.dockerfile)` | \(if .build then "yes" else "no: " + .reason end) | \(.platforms | join("<br>")) |"' <<< "${MATRIX}"
            echo
            echo "Every target in \`.tekton/\` is listed. An entry that is not simulated says why, next to the image it skips."
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: build-${{ matrix.name }}
    needs: targets
    if: needs.targets.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One red leg must not hide another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix).include }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check whether this target is simulated
        id: gate
        env:
          SIM_BUILD: ${{ matrix.build }}
          SIM_REASON: ${{ matrix.reason }}
        run: |
          set -euo pipefail
          if [ "${SIM_BUILD}" = "false" ]; then
            echo "Not simulated: ${SIM_REASON}"
            echo "should-run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free up disk space
        if: steps.gate.outputs.should-run == 'true'
        uses: ./.github/actions/free-up-disk-space

      - name: Build the Konflux image
        if: steps.gate.outputs.should-run == 'true'
        env:
          SIM_IMAGE: konflux-sim/${{ matrix.name }}:${{ github.sha }}
          SIM_DOCKERFILE: ${{ matrix.dockerfile }}
          SIM_CONTEXT: ${{ matrix.context }}
          SIM_BUILD_ARGS: ${{ join(matrix.build_args, ' ') }}
        run: |
          set -euo pipefail

          build_args=()
          # Word splitting is intended: the generator only emits
          # whitespace-free NAME=VALUE build args.
          for arg in ${SIM_BUILD_ARGS}; do
            build_args+=(--build-arg "${arg}")
          done

          docker build "${build_args[@]}" \
            -f "${SIM_DOCKERFILE}" "${SIM_CONTEXT}" -t "${SIM_IMAGE}"

      - name: Smoke-test the image
        if: steps.gate.outputs.should-run == 'true'
        env:
          SIM_SMOKE: ${{ matrix.smoke }}
          SIM_IMAGE: konflux-sim/${{ matrix.name }}:${{ github.sha }}
        run: hack/konflux-sim/smoke-test.sh "${SIM_SMOKE}" "${SIM_IMAGE}"

  summary:
    name: konflux-build-simulation
    needs: [targets, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report the result
        env:
          TARGETS_RESULT: ${{ needs.targets.result }}
          SHOULD_SKIP: ${{ needs.targets.outputs.should-skip }}
          BUILD_RESULT: ${{ needs.build.result }}
          MATRIX: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail

          if [ "${TARGETS_RESULT}" != "success" ]; then
            echo "FAIL: resolving the Konflux targets ended ${TARGETS_RESULT}." >&2
            exit 1
          fi

          if [ "${SHOULD_SKIP}" = "true" ]; then
            if [ "${BUILD_RESULT}" != "skipped" ]; then
              echo "FAIL: a skip was requested but the builds ran (${BUILD_RESULT})." >&2
              exit 1
            fi
            echo "Skipped on purpose: no image-affecting change, or the skip label/title was set."
            echo "Nothing was built, so this check says skipped, not passed."
            exit 0
          fi

          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "FAIL: the build matrix ended ${BUILD_RESULT}." >&2
            exit 1
          fi

          echo "All simulateable Konflux targets built and started."
          jq -r '.include[] | select(.build == false) | "- not simulated: `\(.name)` - \(.reason)"' <<< "${MATRIX}"
