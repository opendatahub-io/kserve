name: "Konflux Build Simulation"

# Simulates the Konflux pull-request builds defined in .tekton/: every
# PipelineRun that resolves the shared odh-konflux-central
# pipeline/multi-arch-container-build.yaml is built here from the same
# dockerfile, context and build args, plus a smoke test that the built image
# is runnable. The build matrix is generated from .tekton/ at run time
# (hack/konflux-sim/generate-build-matrix.sh), so a new Konflux target cannot
# appear without appearing here.
#
# What this workflow deliberately does not simulate:
# - Konflux-side policy checks (ecosystem-cert-preflight, SAST shell/unicode;
#   shellcheck runs here as make sh-lint in precommit-check) and the
#   comment-gated /group-test integration pipeline.
# - Non-native build platforms (no emulation configured) and the
#   odh-kserve-kueue-controller runtime stage (terms-gated registry base).
#   The generator reports both instead of silently dropping them.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      include-manual-targets:
        description: "Also build comment-gated Konflux targets (autogluon)"
        default: false
        type: boolean

# No paths filter: a required summary check must never stay pending on an
# out-of-scope pull request. The skip decision is made inside check-skip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a new commit cancels a real build; title or label edits must not.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  check-skip:
    name: "Resolve Konflux targets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-skip: ${{ steps.decide.outputs.should-skip }}
      matrix: ${{ steps.decide.outputs.matrix }}
      matrix_with_manual: ${{ steps.decide.outputs.matrix_with_manual }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The full history is needed to diff against the pull request base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install yq
        run: make yq

      - name: Generate build matrix and skip decision
        id: decide
        env:
          # Pull request metadata is attacker-controlled text; it reaches
          # bash through env, never through script interpolation.
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A file change that can affect a Konflux image build. Anything
          # else (docs, tests that do not run inside images) skips the run.
          relevant='(^\.tekton/)|(^\.github/workflows/konflux-build-simulation\.yaml$)|(^\.github/actions/)|(Dockerfile)|(\.dockerignore$)|(\.go$)|((^|/)go\.(mod|sum)$)|(^python/)|(^kserve-module/)|(^hack/)'

          skip=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "merge_group" ]]; then
            # Manual runs opt in; merge-group runs must not stay pending.
            :
          elif [[ "${PR_TITLE}" == *"[skip konflux-sim]"* ]]; then
            skip=true
          elif [[ ",${PR_LABELS}," == *",skip-konflux-sim,"* ]]; then
            skip=true
          else
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "${BASE_SHA}" --depth=1
            fi
            changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
            # Match the captured list, not a pipeline: grep -q closes the
            # pipe early and trips pipefail under !.
            if ! grep -Eq "${relevant}" <<< "${changed}"; then
              skip=true
            fi
          fi

          echo "should-skip=${skip}" >> "${GITHUB_OUTPUT}"

          hack/konflux-sim/generate-build-matrix.sh > matrix.json
          hack/konflux-sim/generate-build-matrix.sh --include-manual > matrix-with-manual.json
          # A gate that emits nothing guards nothing.
          jq -e '.include | length > 0' matrix.json >/dev/null

          {
            echo "matrix<<MATRIX_EOF"
            cat matrix.json
            echo "MATRIX_EOF"
            echo "matrix_with_manual<<MATRIX_EOF"
            cat matrix-with-manual.json
            echo "MATRIX_EOF"
          } >> "${GITHUB_OUTPUT}"

  build-image:
    name: build-${{ matrix.name }}
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      # One red leg must not hide another.
      fail-fast: false
      # Comment-gated Konflux targets are built only on explicit manual runs,
      # mirroring their /build-konflux trigger.
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.include-manual-targets && needs.check-skip.outputs.matrix_with_manual) || needs.check-skip.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Free up disk space
        uses: ./.github/actions/free-up-disk-space

      - name: Build the Konflux image
        env:
          # SIM_ prefix: workflow env must never shadow the Makefile's ?=
          # defaults. These values come from the generated matrix, which the
          # generator validates (whitespace-free paths and build args).
          SIM_IMAGE: konflux-sim/${{ matrix.name }}:${{ github.sha }}
          SIM_DOCKERFILE: ${{ matrix.dockerfile }}
          SIM_CONTEXT: ${{ matrix.context }}
          SIM_TARGET: ${{ matrix.target }}
          SIM_BUILD_ARGS: ${{ matrix.build_args_str }}
        run: |
          set -euo pipefail

          build_args=()
          # Word splitting is intended: the generator only emits
          # whitespace-free NAME=VALUE build args.
          for arg in ${SIM_BUILD_ARGS}; do
            build_args+=(--build-arg "${arg}")
          done

          if [[ -n "${SIM_TARGET}" ]]; then
            docker build "${build_args[@]}" --target "${SIM_TARGET}" \
              -f "${SIM_DOCKERFILE}" "${SIM_CONTEXT}" -t "${SIM_IMAGE}"
          else
            docker build "${build_args[@]}" \
              -f "${SIM_DOCKERFILE}" "${SIM_CONTEXT}" -t "${SIM_IMAGE}"
          fi

      - name: Smoke-test the image
        env:
          SIM_IMAGE: konflux-sim/${{ matrix.name }}:${{ github.sha }}
          SIM_SMOKE: ${{ matrix.smoke }}
          SIM_SMOKE_ARG: ${{ matrix.smoke_arg }}
        run: hack/konflux-sim/smoke-test.sh "${SIM_SMOKE}" "${SIM_IMAGE}" "${SIM_SMOKE_ARG}"

  summary:
    name: "konflux-build-simulation"
    needs: [check-skip, build-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report the result
        env:
          GATE_RESULT: ${{ needs.check-skip.result }}
          SHOULD_SKIP: ${{ needs.check-skip.outputs.should-skip }}
          BUILD_RESULT: ${{ needs.build-image.result }}
        run: |
          set -euo pipefail

          if [[ "${GATE_RESULT}" != "success" ]]; then
            echo "FAIL: the target-resolution job ended ${GATE_RESULT}." >&2
            exit 1
          fi

          if [[ "${SHOULD_SKIP}" == "true" ]]; then
            if [[ "${BUILD_RESULT}" != "skipped" ]]; then
              echo "FAIL: skip was requested but the build job ran (${BUILD_RESULT})." >&2
              exit 1
            fi
            echo "PASS: no Konflux-relevant files changed; the build was skipped."
            exit 0
          fi

          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "FAIL: the Konflux image build matrix ended ${BUILD_RESULT}." >&2
            exit 1
          fi
          echo "PASS: every simulated Konflux pull-request build succeeded."
