name: Push opt-125m modelcar image

on:
  workflow_dispatch:

env:
  DESTINATION: "quay.io/opendatahub/opt-125m-modelcar:latest"
  STORAGE_INITIALIZER: "quay.io/opendatahub/kserve-storage-initializer:odh-master"

jobs:
  build-and-push:
    # Only run from master on the canonical repo, so a fork/side-branch cannot
    # push with the org's Quay credentials. Note: this is a guardrail against
    # accidental/casual misuse, not an airtight control (job content runs from
    # the dispatched ref). Real protection requires environment-scoped secrets
    # with a master-only deployment branch policy.
    if: github.repository == 'opendatahub-io/kserve' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download model
        run: |
          mkdir -p /tmp/model-cache && chmod a+rwx /tmp/model-cache
          docker run --rm \
            --network host \
            -v /tmp/model-cache:/mnt/models \
            -e HF_HUB_DISABLE_PROGRESS_BARS=1 \
            -e TOKIO_WORKER_THREADS=1 \
            -e STORAGE_IGNORE_PATTERNS="*.msgpack,*.h5,flax_model*,tf_model*,rust_model*" \
            "${STORAGE_INITIALIZER}" \
            hf://facebook/opt-125m /mnt/models

      - name: Build modelcar image
        run: |
          printf 'FROM busybox\nCOPY . /models\n' > /tmp/Dockerfile.modelcar
          docker build -t "${DESTINATION}" -f /tmp/Dockerfile.modelcar /tmp/model-cache

      - name: Login to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push modelcar image
        run: docker push "${DESTINATION}"

      - name: Verify
        run: |
          skopeo inspect "docker://${DESTINATION}" | jq '{Digest, Created, Architecture}'
