---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceServiceConfig
metadata:
  name: tls-scanner-llm-config
  labels:
    tests.kserve.io/tls-scanner-fixture: "true"
spec:
  model:
    name: facebook/opt-125m
    uri: hf://facebook/opt-125m
  replicas: 1
  storageInitializer:
    enabled: false
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim-dev:1d5ad96
        command:
          - /app/llm-d-inference-sim
        args:
          - --port
          - "8000"
          - --model
          - "{{ .Spec.Model.Name }}"
          - --mode
          - random
          - --force-dummy-tokenizer
          - "{{if .GlobalConfig.EnableTLS}}--ssl-certfile{{end}}"
          - "{{if .GlobalConfig.EnableTLS}}/var/run/kserve/tls/tls.crt{{end}}"
          - "{{if .GlobalConfig.EnableTLS}}--ssl-keyfile{{end}}"
          - "{{if .GlobalConfig.EnableTLS}}/var/run/kserve/tls/tls.key{{end}}"
        ports:
          - containerPort: 8000
            name: https
            protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 2Gi
